<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Txl GPT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%2310A37F%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22sans-serif%22 font-weight=%22700%22>T</text></svg>">
<style>
  :root {
    --bg: #212121; --panel: #171717; --card: #2a2a2a; --text: #ececec; --muted: #9b9b9b;
    --border: #3a3a3a; --accent: #10A37F; --accent-hover: #189b78;
    --danger-bg: #3a2422; --danger-text: #ff9e82; --danger-border: #5a3428;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: min(380px, 90vw); background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); padding: 32px 28px;
  }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 700; font-size: 1.25rem; margin-bottom: 4px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  .sub { text-align: center; color: var(--muted); font-size: 0.86rem; margin: 0 0 24px; }
  label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); font-size: 0.9rem; margin-bottom: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .password-field { position: relative; }
  .password-field input { padding-right: 44px; }
  .toggle-password {
    position: absolute; top: 0; right: 0; bottom: 0; width: 40px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0;
  }
  .toggle-password:hover { color: var(--accent); }
  button.submit {
    width: 100%; padding: 11px; border: none; border-radius: 9px; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer;
  }
  button.submit:hover { background: var(--accent-hover); }
  .error {
    background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border);
    border-radius: 8px; padding: 10px 12px; font-size: 0.84rem; margin-bottom: 16px;
  }
  .switch { text-align: center; font-size: 0.84rem; color: var(--muted); margin-top: 18px; }
  .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">T</span> Txl GPT</div>
  <p class="sub">Log in to your account</p>
  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
  <form method="POST">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
    <label for="password">Password</label>
    <div class="password-field">
      <input type="password" id="password" name="password" required>
      <button type="button" class="toggle-password" data-target="password" aria-label="Show password">👁</button>
    </div>
    <button class="submit" type="submit">Log in</button>
  </form>
  <p class="switch"><a href="/forgot-password">Forgot password?</a></p>
  <p class="switch">No account yet? <a href="/signup">Sign up</a></p>
</div>
<script>
document.querySelectorAll('.toggle-password').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
  });
});
</script>
</body>
</html>
