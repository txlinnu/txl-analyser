<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password - TXL Cloud</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2290%22 fill=%22%23C15F3C%22>✦</text></svg>">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#C15F3C">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js')); }</script>
<script>(function(){var t=localStorage.getItem('txlcloud-theme')||'dark';if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --main-bg: #FAF9F6; --card: #ffffff; --text: #3D3929; --muted: #837F72;
    --border: #E5E1D6; --accent: #C15F3C; --accent-hover: #A94F30;
    --shadow: 0 1px 2px rgba(61,57,41,0.04), 0 8px 24px rgba(61,57,41,0.05);
    --danger-bg: #FBEAE7; --danger-text: #B23B1F; --danger-border: #F0C9BE;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --main-bg: #262624; --card: #2D2C29; --text: #E8E6DC; --muted: #9A9587;
      --border: #3A3833; --accent: #D97757; --accent-hover: #E68A6C;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3);
      --danger-bg: #3A241E; --danger-text: #FF9E82; --danger-border: #5A3428;
    }
  }
  :root[data-theme="dark"] {
    --main-bg: #262624; --card: #2D2C29; --text: #E8E6DC; --muted: #9A9587;
    --border: #3A3833; --accent: #D97757; --accent-hover: #E68A6C;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3);
    --danger-bg: #3A241E; --danger-text: #FF9E82; --danger-border: #5A3428;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--main-bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: min(380px, 90vw); background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); padding: 32px 28px;
  }
  .brand { display: flex; align-items: center; gap: 8px; justify-content: center; font-weight: 700; font-size: 1.2rem; margin-bottom: 4px; }
  .brand .mark { color: var(--accent); }
  .sub { text-align: center; color: var(--muted); font-size: 0.86rem; margin: 0 0 24px; }
  label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--main-bg); color: var(--text); font-size: 0.9rem; margin-bottom: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .password-field { position: relative; }
  .password-field input { padding-right: 44px; }
  .toggle-password {
    position: absolute; top: 0; right: 0; bottom: 0; width: 40px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0;
  }
  .toggle-password:hover { color: var(--accent); }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 9px; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .error {
    background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border);
    border-radius: 8px; padding: 10px 12px; font-size: 0.84rem; margin-bottom: 16px;
  }
  .hint { font-size: 0.74rem; color: var(--muted); margin: -12px 0 16px; }
  .switch { text-align: center; font-size: 0.84rem; color: var(--muted); margin-top: 18px; }
  .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">✦</span> TXL Cloud</div>
  {% if not valid %}
    <p class="sub">Link expired or invalid</p>
    <div class="error">⚠️ This password reset link is invalid or has expired. Reset links only last 1 hour.</div>
    <p class="switch"><a href="/forgot-password">Request a new link</a></p>
  {% else %}
    <p class="sub">Choose a new password</p>
    {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
    <form method="POST">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="password">New password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" required minlength="8">
        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">👁</button>
      </div>
      <p class="hint">At least 8 characters.</p>
      <label for="confirm">Confirm new password</label>
      <div class="password-field">
        <input type="password" id="confirm" name="confirm" required minlength="8">
        <button type="button" class="toggle-password" data-target="confirm" aria-label="Show password">👁</button>
      </div>
      <button type="submit">Set new password</button>
    </form>
    <p class="switch"><a href="/login">← Back to log in</a></p>
  {% endif %}
</div>
<script>
document.querySelectorAll('.toggle-password').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });
});
</script>
</body>
</html>
