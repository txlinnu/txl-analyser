<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory - Txl GPT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%2310A37F%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22sans-serif%22 font-weight=%22700%22>T</text></svg>">
<style>
  :root {
    --bg: #212121; --panel: #2a2a2a; --bubble: #2f2f2f; --text: #ececec; --muted: #9b9b9b;
    --border: #3a3a3a; --accent: #10A37F; --accent-hover: #189b78;
    --danger-bg: #3a2422; --danger-text: #ff9e82; --danger-border: #5a3428;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
  .topbar .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.86rem; margin: 0 0 24px; }
  .add-form { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 22px; display: flex; gap: 8px; }
  .add-form input {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--text); font-size: 0.88rem; outline: none;
  }
  .add-form input:focus { border-color: var(--accent); }
  .add-form button { border: none; background: var(--accent); color: #fff; padding: 0 18px; border-radius: 9px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .add-form button:hover { background: var(--accent-hover); }
  .error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); border-radius: 8px; padding: 9px 12px; font-size: 0.82rem; margin-bottom: 14px; display: none; }
  .error.show { display: block; }
  .mem-list { display: flex; flex-direction: column; gap: 8px; }
  .mem-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .mem-text { font-size: 0.88rem; white-space: pre-wrap; word-wrap: break-word; }
  .mem-del { border: none; background: var(--bubble); color: var(--muted); padding: 5px 9px; border-radius: 7px; font-size: 0.75rem; cursor: pointer; flex-shrink: 0; }
  .mem-del:hover { background: var(--danger-bg); color: var(--danger-text); }
  .empty { color: var(--muted); font-size: 0.86rem; text-align: center; padding: 40px 0; }
  .hint { font-size: 0.76rem; color: var(--muted); margin: 0 0 20px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/" style="display:flex;align-items:center;gap:8px;"><span class="mark">T</span></a>
  <a href="/">← Back to chat</a>
</div>
<div class="wrap">
  <h1>🧠 Memory</h1>
  <p class="sub">Facts Txl GPT remembers about you across every conversation.</p>
  <p class="hint">Tip: start any chat message with "remember that ..." and Txl GPT saves it here automatically.</p>

  <div class="error" id="form-error"></div>
  <div class="add-form">
    <input type="text" id="mem-input" placeholder="Add something to remember..." maxlength="2000">
    <button id="add-btn" type="button">Add</button>
  </div>

  <div class="mem-list" id="mem-list">
    {% for m in memories %}
    <div class="mem-item" data-id="{{ m.id }}">
      <div class="mem-text">{{ m.content }}</div>
      <button class="mem-del" data-id="{{ m.id }}">Delete</button>
    </div>
    {% else %}
    <div class="empty" id="empty-msg">Nothing remembered yet.</div>
    {% endfor %}
  </div>
</div>
<script>
const formError = document.getElementById('form-error');
function showError(msg) { formError.textContent = msg; formError.classList.add('show'); }

document.getElementById('add-btn').addEventListener('click', async () => {
  formError.classList.remove('show');
  const input = document.getElementById('mem-input');
  const content = input.value.trim();
  if (!content) return;
  const res = await fetch('/memory/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) });
  const data = await res.json();
  if (!res.ok || !data.ok) { showError(data.error || 'Could not save that.'); return; }
  window.location.reload();
});
document.getElementById('mem-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('add-btn').click(); });

document.querySelectorAll('.mem-del').forEach(btn => {
  btn.addEventListener('click', async () => {
    await fetch(`/memory/${btn.dataset.id}/delete`, { method: 'POST' });
    btn.closest('.mem-item').remove();
  });
});
</script>
</body>
</html>
