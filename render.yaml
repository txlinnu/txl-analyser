services:
  - type: web
    name: txl-analyser
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-local.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: PROXY_URL
        sync: false
